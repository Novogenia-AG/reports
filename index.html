<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novogenia Gruppe · Finanzcockpit</title>
<style>
:root{
  --bg:#00133f; --bg-side:#000a26; --panel:#001a52;
  --panel-line:rgba(120,180,255,.22);
  --ink:#e8f1ff; --ink-dim:#93b2e0; --ink-soft:#c3d6f3;
  --accent:#28b3ff; --accent-bar:#2196f3; --accent-bar-hi:#5cc0ff;
  --row-alt:rgba(255,255,255,.025); --row-hi:rgba(40,179,255,.10);
  --pos:#3ddc97; --neg:#ff6b6b; --plan:#b98cff; --warn:#ffc857;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;
  -webkit-font-smoothing:antialiased}
body{font-size:13px}
.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}

/* ---------- Seitenleiste ---------- */
aside.sidebar{background:var(--bg-side);border-right:1px solid var(--panel-line);
  padding:22px 14px 90px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:0 6px}
.badge{width:34px;height:34px;border-radius:6px;flex:none;
  background:linear-gradient(135deg,#28b3ff 0%,#1166cc 100%);
  display:grid;place-items:center;color:#001a52;font-weight:900;font-size:15px}
.logo-text{font-size:12px;font-weight:800;letter-spacing:.06em}
.logo-text .sub{display:block;font-size:9px;letter-spacing:.2em;color:var(--ink-dim);
  margin-top:2px;font-weight:600}
.build-stamp{margin:0 6px 18px;padding:6px 8px;background:rgba(40,179,255,.06);
  border:1px solid rgba(120,180,255,.18);border-radius:4px;font-size:10.5px;
  color:var(--ink-dim);line-height:1.55}
.build-stamp .stamp-label{display:block;font-size:9px;color:rgba(147,178,224,.55);
  text-transform:uppercase;letter-spacing:.1em;margin-bottom:1px}
.sidebar nav{display:flex;flex-direction:column;gap:3px}
.group-label{font-size:10px;color:var(--ink-dim);letter-spacing:.2em;text-transform:uppercase;
  font-weight:600;padding:16px 12px 6px}
.sidebar nav a{display:flex;align-items:center;gap:9px;padding:8px 12px;color:var(--ink-soft);
  font-size:12.5px;font-weight:500;text-decoration:none;border-radius:5px;cursor:pointer;
  border-left:2px solid transparent;transition:background .12s,color .12s,border-color .12s}
.sidebar nav a:hover{background:rgba(40,179,255,.07);color:var(--ink)}
.sidebar nav a.active{background:rgba(40,179,255,.14);color:var(--ink);
  border-left-color:var(--accent);font-weight:700}
.sidebar nav a .flag{font-size:9px;color:var(--ink-dim);margin-left:auto;letter-spacing:.08em}
.sidebar nav a.active .flag{color:var(--accent)}

/* ---------- Inhalt ---------- */
main.content{padding:22px 28px 80px;max-width:1560px}
.section-banner{position:relative;display:flex;align-items:center;gap:16px;padding:20px 24px;
  margin:0 0 20px;border:1px solid rgba(40,179,255,.35);border-left:5px solid var(--accent);
  border-radius:4px;background:linear-gradient(90deg,rgba(40,179,255,.16) 0%,
    rgba(40,179,255,.05) 70%,rgba(40,179,255,.02) 100%);
  box-shadow:0 0 30px rgba(40,179,255,.08)}
.section-banner .sb-icon{font-size:32px;line-height:1;color:var(--accent)}
.section-banner h1{font-size:20px;font-weight:800;letter-spacing:.02em}
.section-banner .sb-sub{font-size:11.5px;color:var(--ink-dim);margin-top:4px;letter-spacing:.04em}

/* Filterleiste */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px;
  padding:12px 14px;background:var(--panel);border:1px solid var(--panel-line);border-radius:4px}
.filters .fl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);
  font-weight:600;margin-right:2px}
.seg{display:flex;border:1px solid var(--panel-line);border-radius:4px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--ink-soft);font:inherit;font-size:11.5px;
  font-weight:600;padding:6px 13px;cursor:pointer;letter-spacing:.03em;
  border-right:1px solid var(--panel-line)}
.seg button:last-child{border-right:0}
.seg button:hover{background:rgba(40,179,255,.10);color:var(--ink)}
.seg button.on{background:rgba(40,179,255,.22);color:var(--accent)}
.seg button.on.plan{background:rgba(185,140,255,.22);color:var(--plan)}
.seg button:disabled{opacity:.3;cursor:default}
.filters .spacer{flex:1}
.hint{font-size:11px;color:var(--ink-dim)}

/* Karten */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;
  margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--panel-line);border-radius:4px;
  padding:13px 15px 14px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);
  opacity:.65}
.card.pos::before{background:var(--pos)} .card.neg::before{background:var(--neg)}
.card.planc::before{background:var(--plan)}
.card .k{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);
  font-weight:600;margin-bottom:7px;line-height:1.35}
.card .v{font-size:21px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.card .v.pos{color:var(--pos)} .card .v.neg{color:var(--neg)}
.card .s{font-size:10.5px;color:var(--ink-dim);margin-top:5px;font-variant-numeric:tabular-nums}
.card .s .up{color:var(--pos)} .card .s .dn{color:var(--neg)}

/* Panels */
.panel{background:var(--panel);border:1px solid var(--panel-line);border-radius:4px;
  margin-bottom:18px;overflow:hidden}
.panel > h2{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:12px 16px;border-bottom:1px solid var(--panel-line);color:var(--ink-soft);
  display:flex;align-items:center;gap:10px}
.panel > h2 .note{font-size:10px;letter-spacing:.04em;text-transform:none;color:var(--ink-dim);
  font-weight:500;margin-left:auto}
.panel .body{padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:1180px){.grid2{grid-template-columns:1fr}}

/* Tabellen */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);
  font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--panel-line);
  white-space:nowrap}
th:first-child{text-align:left}
td{padding:6px 10px;text-align:right;font-size:12.5px;border-bottom:1px solid rgba(120,180,255,.07)}
td:first-child{text-align:left}
tr:nth-child(even) td{background:var(--row-alt)}
tr.sum td{font-weight:800;background:rgba(40,179,255,.10);border-top:1px solid var(--panel-line);
  border-bottom:1px solid var(--panel-line)}
tr.head td{font-weight:700;color:var(--ink)}
tr.kat td{color:var(--ink-soft);font-size:12px}
tr.kat td:first-child{padding-left:30px}
tr.konto td{color:var(--ink-dim);font-size:11.5px}
tr.konto td:first-child{padding-left:52px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--row-hi)}
.tw{font-size:10px;color:var(--ink-dim);margin-left:7px;font-weight:600}
.pos{color:var(--pos)} .neg{color:var(--neg)} .dim{color:var(--ink-dim)}
.bar-cell{position:relative;min-width:120px}
.bar-cell .bg{position:absolute;left:10px;top:50%;transform:translateY(-50%);height:11px;
  background:rgba(40,179,255,.28);border-radius:2px}
.bar-cell .bg.n{background:rgba(255,107,107,.32)}
.bar-cell span{position:relative}

/* Hinweise */
.notice{display:flex;gap:11px;padding:11px 14px;border-radius:4px;font-size:12px;
  line-height:1.6;margin-bottom:12px;border:1px solid}
.notice.warn{background:rgba(255,200,87,.07);border-color:rgba(255,200,87,.3);color:#ffe3a3}
.notice.info{background:rgba(40,179,255,.06);border-color:rgba(40,179,255,.25);color:var(--ink-soft)}
.notice .ic{font-size:15px;line-height:1.3}

/* Schleuse */
.gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:99;
  padding:24px}
.gate-box{width:100%;max-width:370px;background:var(--panel);border:1px solid var(--panel-line);
  border-radius:6px;padding:34px 30px 26px;text-align:center;
  box-shadow:0 0 60px rgba(40,179,255,.10)}
.gate-badge{width:46px;height:46px;border-radius:8px;margin:0 auto 16px;
  background:linear-gradient(135deg,#28b3ff 0%,#1166cc 100%);display:grid;place-items:center;
  color:#001a52;font-weight:900;font-size:21px}
.gate-box h1{font-size:16px;font-weight:800;letter-spacing:.06em}
.gate-sub{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim);
  margin:5px 0 22px;font-weight:600}
.gate-box input{width:100%;padding:11px 13px;background:rgba(0,10,38,.8);color:var(--ink);
  border:1px solid var(--panel-line);border-radius:4px;font:inherit;font-size:14px;
  letter-spacing:.06em;text-align:center}
.gate-box input:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(40,179,255,.14)}
.gate-box button{width:100%;margin-top:11px;padding:11px;border:0;border-radius:4px;
  background:var(--accent-bar);color:#fff;font:inherit;font-size:13px;font-weight:700;
  letter-spacing:.06em;cursor:pointer}
.gate-box button:hover{background:var(--accent-bar-hi)}
.gate-box button:disabled{opacity:.55;cursor:default}
.gate-msg{min-height:19px;margin-top:12px;font-size:11.5px;color:var(--neg);letter-spacing:.02em}
.gate-msg.busy{color:var(--ink-dim)}
.gate-foot{margin-top:18px;font-size:10.5px;line-height:1.65;color:var(--ink-dim);
  border-top:1px solid var(--panel-line);padding-top:14px}
svg .gl{stroke:rgba(120,180,255,.13);stroke-width:1}
svg .ax{fill:var(--ink-dim);font-size:10px}
svg .vl{fill:var(--ink-soft);font-size:9.5px;font-weight:600}
svg .bar{transition:opacity .12s} svg .bar:hover{opacity:.78}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--ink-soft);
  margin:2px 0 12px;padding-left:2px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;
  vertical-align:-1px}
</style>
</head>
<body>
<div id="gate" class="gate" style="display:none">
  <form class="gate-box" id="gateForm" autocomplete="off">
    <div class="gate-badge">N</div>
    <h1>Novogenia Gruppe</h1>
    <p class="gate-sub">Finanzcockpit &middot; vertraulich</p>
    <input type="password" id="pw" placeholder="Passwort" autocomplete="current-password"
           autofocus spellcheck="false">
    <button type="submit" id="gateBtn">Öffnen</button>
    <div class="gate-msg" id="gateMsg"></div>
    <p class="gate-foot">Die Finanzdaten dieser Seite sind verschlüsselt gespeichert und
      werden erst im Browser entschlüsselt. Ohne Passwort enthält die Datei nichts Lesbares.</p>
  </form>
</div>
<div class="app">
  <aside class="sidebar">
    <div class="logo-row">
      <div class="badge">N</div>
      <div class="logo-text">NOVOGENIA GRUPPE<span class="sub">FINANZCOCKPIT</span></div>
    </div>
    <div class="build-stamp">
      <span class="stamp-label">Datenstand</span>
      <span id="stamp"></span>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main class="content" id="content"></main>
</div>

<script id="payload" type="application/json"></script>
<script>
let D = null;

/* ===================== Werkzeug ===================== */
const nf0 = new Intl.NumberFormat('de-DE',{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1});
const fmt  = v => (v===null||v===undefined||!isFinite(v)) ? '—' : nf0.format(Math.round(v));
const fmtM = v => (v===null||v===undefined||!isFinite(v)) ? '—' :
  (Math.abs(v)>=1e6 ? nf1.format(v/1e6)+' Mio' : nf0.format(Math.round(v)));
const sign = v => v>0.5 ? 'pos' : (v<-0.5 ? 'neg' : '');
const esc  = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

let GUV, BIL, SUB, GID, JAHRE_IST, JAHRE_PLAN, IST_JAHR, IST_MON;

/* Monate eines Jahres, im laufenden Jahr nur bis zum Datenstand */
function monateVon(jahr, szen, bisMonat){
  const max = (szen==='ist' && jahr===IST_JAHR) ? IST_MON : 12;
  const bis = bisMonat ? Math.min(bisMonat,max) : max;
  return Array.from({length:bis},(_,i)=>jahr+'-'+String(i+1).padStart(2,'0'));
}
/* Rohsumme einer Kategorie */
function katSum(firma, szen, kat, monate){
  const q = (D[szen][firma]||{})[kat]; if(!q) return 0;
  let s=0; for(const m of monate) if(q[m]) s+=q[m];
  return s;
}
/* Gruppenwerte einer Firma - Aufwand kommt bereits negativ heraus */
function guvWerte(firma, szen, monate){
  const r = {};
  for(const g of GUV){ if(!g.kats.length) continue;
    let s=0; for(const k of g.kats) s+=katSum(firma,szen,k,monate);
    r[g.id] = s*g.vz;
  }
  for(const id in SUB){ let s=0; for(const p of SUB[id]) s+=(r[p]||0); r[id]=s; }
  return r;
}
function guvWerteGruppe(firmen, szen, monate){
  const r={}; for(const f of firmen){ const w=guvWerte(f,szen,monate);
    for(const k in w) r[k]=(r[k]||0)+w[k]; }
  return r;
}
/* Bilanz = Monatsbestand, also der letzte Monat der Auswahl */
function bilWerte(firma, szen, stichtag){
  const r={};
  for(const g of BIL){ let s=0;
    for(const k of g.kats){ const q=(D[szen][firma]||{})[k]; if(q&&q[stichtag]) s+=q[stichtag]; }
    r[g.id]=s;
  }
  r._aktiva = BIL.filter(g=>g.seite==='A').reduce((a,g)=>a+r[g.id],0);
  r._passiva= BIL.filter(g=>g.seite==='P').reduce((a,g)=>a+r[g.id],0);
  return r;
}
function letzterMonat(firma, szen, jahr){
  const o=D[szen][firma]||{}; let best=null;
  for(const k in o) for(const m in o[k]) if(m.slice(0,4)===jahr && (!best||m>best)) best=m;
  return best;
}

/* ===================== Diagramme ===================== */
function chart(opt){
  const W=opt.width||760, H=opt.height||240, PL=opt.padLeft||62, PR=16, PT=14, PB=30;
  const labels=opt.labels, series=opt.series, lines=opt.lines||[];
  const iw=W-PL-PR, ih=H-PT-PB;
  let lo=0, hi=0;
  series.forEach(s=>s.vals.forEach(v=>{ if(v>hi)hi=v; if(v<lo)lo=v; }));
  lines.forEach(s=>s.vals.forEach(v=>{ if(v>hi)hi=v; if(v<lo)lo=v; }));
  if(hi===lo){hi=hi||1;lo=Math.min(0,lo);}
  const pad=(hi-lo)*0.10; hi+=pad; lo = lo<0 ? lo-pad : 0;
  const y = v => PT+ih-((v-lo)/(hi-lo))*ih;
  const n = labels.length, slot = iw/n;
  const nb = series.length, bw = Math.min(46,(slot*0.72)/Math.max(nb,1));
  let g='';
  const steps=4;
  for(let i=0;i<=steps;i++){ const v=lo+(hi-lo)*i/steps, yy=y(v);
    g+=`<line class="gl" x1="${PL}" y1="${yy.toFixed(1)}" x2="${W-PR}" y2="${yy.toFixed(1)}"/>`+
       `<text class="ax" x="${PL-8}" y="${(yy+3.5).toFixed(1)}" text-anchor="end">${fmtM(v)}</text>`;
  }
  const y0=y(0);
  g+=`<line x1="${PL}" y1="${y0.toFixed(1)}" x2="${W-PR}" y2="${y0.toFixed(1)}" stroke="rgba(120,180,255,.4)" stroke-width="1"/>`;
  labels.forEach((lb,i)=>{
    const cx=PL+slot*(i+0.5);
    g+=`<text class="ax" x="${cx.toFixed(1)}" y="${H-10}" text-anchor="middle">${esc(lb)}</text>`;
    series.forEach((s,j)=>{
      const v=s.vals[i]; if(v===null||v===undefined) return;
      const bx=cx-(nb*bw)/2+j*bw, yy=Math.min(y(v),y0), h=Math.abs(y(v)-y0);
      const fill=s.hatch?`url(#hx${j})`:s.color;
      g+=`<rect class="bar" x="${bx.toFixed(1)}" y="${yy.toFixed(1)}" width="${(bw-3).toFixed(1)}" `+
         `height="${Math.max(h,0.6).toFixed(1)}" fill="${fill}" rx="1.5">`+
         `<title>${esc(s.name)} ${esc(lb)}: ${fmt(v)} EUR</title></rect>`;
      if(opt.showValues!==false && Math.abs(v)>0.5 && n*nb<=26)
        g+=`<text class="vl" x="${(bx+(bw-3)/2).toFixed(1)}" y="${(v>=0?yy-4:yy+h+11).toFixed(1)}" text-anchor="middle">${fmtM(v)}</text>`;
    });
  });
  lines.forEach(s=>{
    const pts=s.vals.map((v,i)=>v===null?null:[PL+slot*(i+0.5),y(v)]).filter(Boolean);
    if(pts.length>1) g+=`<polyline fill="none" stroke="${s.color}" stroke-width="2.2" `+
      `stroke-linejoin="round" ${s.dash?'stroke-dasharray="5 4"':''} points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>`;
    pts.forEach(p=>{ g+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${s.color}"/>`; });
  });
  const defs=`<defs>${series.map((s,j)=>s.hatch?
    `<pattern id="hx${j}" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">`+
    `<rect width="6" height="6" fill="${s.color}22"/><line x1="0" y1="0" x2="0" y2="6" stroke="${s.color}" stroke-width="2.4"/></pattern>`:'').join('')}</defs>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet">${defs}${g}</svg>`;
}
const FARBEN=['#28b3ff','#3ddc97','#b98cff','#ffc857','#ff6b6b','#4ecdc4','#f78fb3',
              '#6a8cff','#9fe870','#ffa45b','#5cc0ff','#c7a2ff','#8fd3c7'];
/* Gestapelte Balken: Positives waechst nach oben, Negatives nach unten,
   die Nettolinie zeigt, was unterm Strich bleibt. */
function stackChart(opt){
  const W=opt.width||940,H=opt.height||320,PL=68,PR=14,PT=16,PB=36;
  const labels=opt.labels, series=opt.series;
  const iw=W-PL-PR, ih=H-PT-PB;
  let hi=0, lo=0, netto=[];
  labels.forEach((_,i)=>{
    let p=0,n=0;
    series.forEach(s=>{const v=s.vals[i]||0; v>0?p+=v:n+=v;});
    netto.push(p+n); if(p>hi)hi=p; if(n<lo)lo=n;
  });
  if(hi===lo){hi=hi||1;}
  const pad=(hi-lo)*0.08; hi+=pad; lo=lo<0?lo-pad:0;
  const y=v=>PT+ih-((v-lo)/(hi-lo))*ih;
  const slot=iw/labels.length, bw=Math.min(36,slot*0.70);
  let g='';
  for(let i=0;i<=4;i++){ const v=lo+(hi-lo)*i/4, yy=y(v);
    g+=`<line class="gl" x1="${PL}" y1="${yy.toFixed(1)}" x2="${W-PR}" y2="${yy.toFixed(1)}"/>`+
       `<text class="ax" x="${PL-8}" y="${(yy+3.5).toFixed(1)}" text-anchor="end">${fmtM(v)}</text>`; }
  const y0=y(0);
  g+=`<line x1="${PL}" y1="${y0.toFixed(1)}" x2="${W-PR}" y2="${y0.toFixed(1)}" stroke="rgba(120,180,255,.45)" stroke-width="1"/>`;
  const jede=Math.ceil(labels.length/24);
  labels.forEach((lb,i)=>{
    const cx=PL+slot*(i+0.5), bx=cx-bw/2;
    let aP=0, aN=0;
    series.forEach(s=>{
      const v=s.vals[i]||0; if(!v) return;
      let yt,h;
      if(v>0){ yt=y(aP+v); h=y(aP)-y(aP+v); aP+=v; }
      else   { yt=y(aN);   h=y(aN+v)-y(aN);  aN+=v; }
      g+=`<rect class="bar" x="${bx.toFixed(1)}" y="${yt.toFixed(1)}" width="${bw.toFixed(1)}" `+
         `height="${Math.max(h,0.4).toFixed(1)}" fill="${s.color}"><title>${esc(s.name)} · `+
         `${esc(lb)}: ${fmt(v)} EUR</title></rect>`;
    });
    if(i%jede===0)
      g+=`<text class="ax" x="${cx.toFixed(1)}" y="${H-12}" text-anchor="middle">${esc(lb)}</text>`;
  });
  const pts=netto.map((v,i)=>[PL+slot*(i+0.5),y(v)]);
  g+=`<polyline fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="1.8" `+
     `stroke-linejoin="round" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>`;
  pts.forEach((p,i)=>{ g+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" `+
    `fill="#00133f" stroke="#fff" stroke-width="1.4"><title>Netto ${esc(labels[i])}: `+
    `${fmt(netto[i])} EUR</title></circle>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}
function legende(items){
  return '<div class="legend">'+items.map(i=>`<span><i style="background:${i.color}"></i>${esc(i.name)}</span>`).join('')+'</div>';
}

/* ===================== Zustand ===================== */
const S = {view:'konzern', firma:null, jahr:null, szen:'ist', offen:{},
           stapelMass:'_ebit', stapelZeit:null};

function navHTML(){
  let h = '<div class="group-label">Konzern</div>';
  h += `<a data-v="konzern" class="${S.view==='konzern'?'active':''}">◈ Konsolidierung</a>`;
  h += `<a data-v="vergleich" class="${S.view==='vergleich'?'active':''}">◫ Firmenvergleich</a>`;
  h += `<a data-v="qualitaet" class="${S.view==='qualitaet'?'active':''}">⚑ Datenqualität</a>`;
  h += '<div class="group-label">Gesellschaften</div>';
  for(const f of D.firmen)
    h += `<a data-v="firma" data-f="${esc(f.name)}" class="${S.view==='firma'&&S.firma===f.name?'active':''}">`+
         `${esc(f.name)}<span class="flag">${esc(f.land)}</span></a>`;

function bindNav(){
  document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>{

  });
}

/* ===================== Konzernseite ===================== */
function konzernPerioden(){
  const k=Object.entries(D.konzern).map(([id,e])=>({id,...e}));
  k.sort((a,b)=>a.periode.localeCompare(b.periode));
  return k;
}
function renderKonzern(){
  const per = konzernPerioden();
  const jahres = per.filter(p=>p.periode.endsWith('-12'));
  const aktuell = jahres.filter(p=>p.szenario==='ist').slice(-1)[0];

  /* Reihe Umsatz/Ergebnis: Ist-Konzern, Plan-Konzern, plus nicht konsolidierte Summen */
  const jahre = ['2022','2023','2024','2025','2026','2027','2028','2029'];
  const kz = {}; jahres.forEach(p=>kz[p.periode.slice(0,4)]=p);
  const umsatzIst=[], umsatzPlan=[], ergIst=[], ergPlan=[], summeRoh=[];
  const alleFirmen = D.firmen.map(f=>f.name);
  for(const j of jahre){
    const p = kz[j];
    const istK = p && p.szenario==='ist' ? p : null;
    const plK  = p && p.szenario==='plan' ? p : null;
    umsatzIst.push(istK && istK.guv.umsatz ? istK.guv.umsatz[2] : null);
    ergIst.push(istK && istK.guv.jahr ? istK.guv.jahr[2] : null);
    umsatzPlan.push(plK && plK.guv.umsatz ? plK.guv.umsatz[2] : null);
    ergPlan.push(plK && plK.guv.jahr ? plK.guv.jahr[2] : null);
    /* Summe der Einzelfirmen, nur wo keine Konsolidierung vorliegt */
    if(!istK && j<=IST_JAHR){
      const w = guvWerteGruppe(alleFirmen,'ist',monateVon(j,'ist'));
      summeRoh.push(w.umsatz||null);
    } else summeRoh.push(null);
  }

  const g = aktuell.guv, b = aktuell.bilanz;
  const ekq = b.ek && b.aktiva && b.aktiva[2] ? b.ek[2]/b.aktiva[2]*100 : null;
  const vor = jahres.filter(p=>p.szenario==='ist' && p.periode<aktuell.periode).slice(-1)[0];
  const kreis = aktuell.kreis||[];

  const kfarbe = (v,cls)=> v<-0.5 ? 'neg' : (cls==='pos' && v>0.5 ? 'pos' : '');
  const karte = (k,v,cls,s)=>`<div class="card ${cls||''}"><div class="k">${k}</div>`+
    `<div class="v ${kfarbe(v,cls)}">${fmtM(v)}</div>${s?`<div class="s">${s}</div>`:''}</div>`;

  let h = `<div class="section-banner"><div class="sb-icon">◈</div><div>`+
    `<h1>Konzern Novogenia — konsolidiert</h1>`+
    `<div class="sb-sub">Geschäftsjahr ${aktuell.periode.slice(0,4)} · Quelle LucaNet-Konsolidierung `+
    `· Datenstand Einzelgesellschaften ${MON[IST_MON-1]} ${IST_JAHR}</div></div></div>`;

  h += `<div class="cards">`+
    karte('Konzernumsatz', g.umsatz?g.umsatz[2]:null,'', `${kreis.length} Gesellschaften im Kreis`)+
    karte('Rohergebnis', g.roh?g.roh[2]:null,'', g.roh&&g.umsatz?`${nf1.format(g.roh[2]/g.umsatz[2]*100)} % vom Umsatz`:'')+
    karte('Betriebsergebnis', g.ebit?g.ebit[2]:null, (g.ebit&&g.ebit[2]<0)?'neg':'pos')+
    karte('Konzernergebnis', g.jahr?g.jahr[2]:null, (g.jahr&&g.jahr[2]<0)?'neg':'pos',
          g.jahr?`vor Verrechnung ${fmtM(g.jahr[0])}`:'')+
    karte('Bilanzsumme', b.aktiva?b.aktiva[2]:null,'', b.aktiva?`vor Verrechnung ${fmtM(b.aktiva[0])}`:'')+
    karte('Eigenkapital', b.ek?b.ek[2]:null,'', ekq!==null?`Quote ${nf1.format(ekq)} %`:'')+
    karte('Liquide Mittel', b.liquide?b.liquide[2]:null)+
    `</div>`;

  /* Verlauf */
  h += `<div class="panel"><h2>Umsatz und Ergebnis im Konzern`+
    `<span class="note">durchgezogen = konsolidiert · schraffiert = nur Summe der Einzelfirmen</span></h2><div class="body">`+
    legende([{name:'Umsatz Ist (konsolidiert)',color:'#2196f3'},
             {name:'Umsatz Plan (konsolidiert)',color:'#b98cff'},
             {name:'Umsatz Summe Einzelfirmen (nicht konsolidiert)',color:'#5cc0ff'},
             {name:'Konzernergebnis',color:'#3ddc97'}])+
    chart({labels:jahre, height:300, width:900,
      series:[{name:'Umsatz Ist',color:'#2196f3',vals:umsatzIst},
              {name:'Umsatz Plan',color:'#b98cff',vals:umsatzPlan},
              {name:'Summe Einzelfirmen',color:'#5cc0ff',vals:summeRoh,hatch:true}],
      lines:[{name:'Ergebnis Ist',color:'#3ddc97',vals:ergIst.map((v,i)=>v===null?ergPlan[i]:v),dash:false}]})+
    `</div></div>`;

  /* Monatsergebnis, je Gesellschaft gestapelt */
  const MASSE=[['umsatz','Umsatz'],['_roh','Rohergebnis'],['_ebit','Betriebsergebnis'],
               ['_jahr','Jahresergebnis']];
  const zeitOpt=[...JAHRE_IST.filter(j=>j>='2023'),'alle'];
  const zw = S.stapelZeit==='alle'
    ? D.monate.filter(m=>m>='2023-01' && m<=D.ist_bis)
    : monateVon(S.stapelZeit,'ist');
  const labelsM = zw.map(m=>MON[+m.slice(5,7)-1]+(S.stapelZeit==='alle'?' '+m.slice(2,4):''));
  const beitrag = D.firmen.map(f=>({
      name:f.name,
      vals: zw.map(m=>guvWerte(f.name,'ist',[m])[S.stapelMass]||0)
    })).filter(s=>s.vals.some(v=>Math.abs(v)>0.5));
  beitrag.sort((a,b)=>b.vals.reduce((x,y)=>x+Math.abs(y),0)-a.vals.reduce((x,y)=>x+Math.abs(y),0));
  beitrag.forEach((s,i)=>s.color=FARBEN[i%FARBEN.length]);
  const massLb=(MASSE.find(m=>m[0]===S.stapelMass)||MASSE[3])[1];
  h += `<div class="panel"><h2>${massLb} je Monat und Gesellschaft`+
    `<span class="note">Summe der Einzelgesellschaften, nicht konsolidiert · `+
    `weiße Linie = Netto</span></h2><div class="body">`+
    `<div class="filters" style="margin-bottom:14px"><span class="fl">Größe</span>`+
    `<div class="seg" id="segM">`+
    MASSE.map(([id,lb])=>`<button data-m="${id}" class="${S.stapelMass===id?'on':''}">${lb}</button>`).join('')+
    `</div><span class="fl" style="margin-left:14px">Zeitraum</span><div class="seg" id="segZ">`+
    zeitOpt.map(j=>`<button data-z="${j}" class="${S.stapelZeit===j?'on':''}">${j==='alle'?'Alle':j}</button>`).join('')+
    `</div></div>`+
    legende(beitrag.map(s=>({name:s.name,color:s.color})))+
    stackChart({labels:labelsM, series:beitrag, height:340})+
    `</div></div>`;

  /* Hinweise */
  h += `<div class="panel"><h2>Was diese Zahlen sind — und was nicht</h2><div class="body">`+
    D.checks.luecken.map(t=>`<div class="notice warn"><div class="ic">⚠</div><div>${esc(t)}</div></div>`).join('')+
    `</div></div>`;

  /* Konsolidierungskreis - erklaert die Spruenge in der Reihe */
  const kreisJahre = jahres.filter(p=>p.kreis && p.kreis.length);
  if(kreisJahre.length){
    const alle=[...new Set(kreisJahre.flatMap(p=>p.kreis))].sort();
    h += `<div class="panel"><h2>Konsolidierungskreis<span class="note">Der Kreis wächst — `+
      `Jahresvergleiche sind deshalb nicht gleich auf gleich</span></h2><div class="body"><table>`+
      `<tr><th>Gesellschaft</th>`+kreisJahre.map(p=>`<th>${p.periode.slice(0,4)}`+
        `${p.szenario==='plan'?' P':''}</th>`).join('')+`</tr>`+
      alle.map(n=>`<tr><td>${esc(n)}</td>`+kreisJahre.map(p=>
        `<td>${p.kreis.includes(n)?'<span class="pos">●</span>':'<span class="dim">·</span>'}</td>`).join('')+
        `</tr>`).join('')+
      `<tr class="sum"><td>Anzahl</td>`+kreisJahre.map(p=>`<td>${p.kreis.length}</td>`).join('')+
      `</tr></table></div></div>`;
  }

  /* Ueberleitung */
  h += `<div class="panel"><h2>Überleitung ${aktuell.periode.slice(0,4)} — von der Summe zum Konzern`+
    `<span class="note">Die Verrechnung ist sichtbar, nicht versteckt</span></h2><div class="body">`+
    konzernTabelle(aktuell.guv_voll)+`</div></div>`;

  h += `<div class="panel"><h2>Konzernbilanz ${aktuell.periode.slice(0,4)}</h2><div class="body">`+
    konzernTabelle(aktuell.bilanz_voll)+`</div></div>`;

  /* Beitrag je Gesellschaft */
  if(Object.keys(aktuell.firmen||{}).length){
    const rows = Object.entries(aktuell.firmen).sort((a,b)=>b[1]-a[1]);
    const max = Math.max(...rows.map(r=>Math.abs(r[1])));
    h += `<div class="panel"><h2>Umsatzbeitrag je Gesellschaft ${aktuell.periode.slice(0,4)}`+
      `<span class="note">vor Konsolidierung</span></h2><div class="body"><table>`+
      `<tr><th>Gesellschaft</th><th>Umsatz</th><th style="width:44%"></th><th>Anteil</th></tr>`+
      rows.map(([n,v])=>{
        const ges = rows.reduce((a,r)=>a+r[1],0);
        return `<tr><td>${esc(n)}</td><td>${fmt(v)}</td>`+
          `<td class="bar-cell"><div class="bg ${v<0?'n':''}" style="width:${(Math.abs(v)/max*100*0.92).toFixed(1)}%"></div></td>`+
          `<td class="dim">${nf1.format(v/ges*100)} %</td></tr>`;
      }).join('')+`</table></div></div>`;
  }
  return h;
}
function konzernTabelle(zeilen){
  if(!zeilen||!zeilen.length) return '<div class="hint">Keine Daten.</div>';
  let h = `<table><tr><th>Position</th><th>Summe vor Konsolidierung</th>`+
    `<th>Verrechnung</th><th>Konzern</th></tr>`;
  for(const r of zeilen){
    const top = r.n===0 || /^(1\.|Aktivseite|Passivseite)/.test(r.l);
    const cls = r.n===0 ? 'sum' : (r.n===1?'head':'kat');
    h += `<tr class="${cls}"><td>${esc(r.l)}</td>`+
      `<td>${r.s?fmt(r.s):'<span class="dim">—</span>'}</td>`+
      `<td class="${r.k?sign(r.k):'dim'}">${r.k?fmt(r.k):'—'}</td>`+
      `<td>${r.z?fmt(r.z):'<span class="dim">—</span>'}</td></tr>`;
  }
  return h+'</table>';
}

/* ===================== Firmenseite ===================== */
function renderFirma(){
  const f = S.firma, jahr = S.jahr, szen = S.szen;
  const mon = monateVon(jahr,szen);
  const vjMon = monateVon(String(+jahr-1),szen, szen==='ist'&&jahr===IST_JAHR?IST_MON:12);
  const w  = guvWerte(f,szen,mon);
  const wv = guvWerte(f,szen,vjMon);
  const wp = guvWerte(f,'plan',monateVon(jahr,'plan', szen==='ist'&&jahr===IST_JAHR?IST_MON:12));
  const st = letzterMonat(f,szen,jahr);
  const b  = st ? bilWerte(f,szen,st) : null;
  const meta = D.firmen.find(x=>x.name===f)||{};

  const d = (a,bv)=> (bv&&Math.abs(bv)>1) ? (a/bv-1)*100 : null;
  const kfarbe = (v,cls)=> v<-0.5 ? 'neg' : (cls==='pos' && v>0.5 ? 'pos' : '');
  const karte=(k,v,vgl,cls)=>{
    const p = d(v,vgl);
    return `<div class="card ${cls||''}"><div class="k">${k}</div><div class="v ${kfarbe(v,cls)}">${fmtM(v)}</div>`+
      (p!==null?`<div class="s"><span class="${p>=0?'up':'dn'}">${p>=0?'▲':'▼'} ${nf1.format(Math.abs(p))} %</span> gegen Vorjahr</div>`:'')+
      `</div>`;
  };

  let h = `<div class="section-banner"><div class="sb-icon">▤</div><div><h1>${esc(f)}</h1>`+
    `<div class="sb-sub">${esc(meta.land||'')} · Daten ${esc(meta.von||'')} bis ${esc(meta.bis||'')}`+
    (szen==='ist'&&jahr===IST_JAHR?` · ${jahr} bis ${MON[IST_MON-1]} (Jahr läuft)`:'')+
    `</div></div></div>`;

  h += filterleiste();

  h += `<div class="cards">`+
    karte('Umsatzerlöse', w.umsatz, wv.umsatz)+
    karte('Rohergebnis', w._roh, wv._roh)+
    karte('Personalaufwand', w.personal, wv.personal)+
    karte('EBITDA', w._ebitda, wv._ebitda, w._ebitda<0?'neg':'pos')+
    karte('Betriebsergebnis', w._ebit, wv._ebit, w._ebit<0?'neg':'pos')+
    karte('Jahresergebnis', w._jahr, wv._jahr, w._jahr<0?'neg':'pos')+
    (b?`<div class="card"><div class="k">Bilanzsumme ${esc(st)}</div><div class="v">${fmtM(b._aktiva)}</div>`+
       `<div class="s">Liquidität ${fmtM(b.liquide)}</div></div>`:'')+
    `</div>`;

  /* Monatsverlauf */
  const labels = monateVon(jahr,'x',12).map((m,i)=>MON[i]);
  const reihe = (szenario,gid)=>Array.from({length:12},(_,i)=>{
    const m=jahr+'-'+String(i+1).padStart(2,'0');
    if(szenario==='ist' && jahr===IST_JAHR && i+1>IST_MON) return null;
    const v=guvWerte(f,szenario,[m]); return v[gid];
  });
  h += `<div class="panel"><h2>Monatsverlauf ${esc(jahr)}</h2><div class="body">`+
    legende([{name:'Umsatz Ist',color:'#2196f3'},{name:'Umsatz Plan',color:'#b98cff'},
             {name:'Betriebsergebnis Ist',color:'#3ddc97'}])+
    chart({labels, height:250, width:900, showValues:false,
      series:[{name:'Umsatz Ist',color:'#2196f3',vals:reihe('ist','umsatz')},
              {name:'Umsatz Plan',color:'#b98cff',vals:reihe('plan','umsatz')}],
      lines:[{name:'Betriebsergebnis',color:'#3ddc97',vals:reihe('ist','_ebit')}]})+
    `</div></div>`;

  /* GuV mit Aufriss */
  h += `<div class="panel"><h2>Gewinn- und Verlustrechnung ${esc(jahr)}`+
    `<span class="note">Zeile anklicken für Kategorien, Kategorie für Konten</span></h2><div class="body">`+
    guvTabelle(f,jahr,szen,w,wp,wv,mon)+`</div></div>`;

  /* Bilanz */
  if(b) h += `<div class="panel"><h2>Bilanz zum ${esc(st)}</h2><div class="body">`+
    bilanzTabelle(f,szen,st,b)+`</div></div>`;
  return h;
}

function filterleiste(){
  const jahre = [...new Set([...JAHRE_IST,...JAHRE_PLAN])].sort();
  return `<div class="filters"><span class="fl">Jahr</span><div class="seg" id="segJ">`+
    jahre.map(j=>`<button data-j="${j}" class="${S.jahr===j?'on':''}">${j}</button>`).join('')+
    `</div><span class="fl" style="margin-left:14px">Szenario</span><div class="seg" id="segS">`+
    `<button data-s="ist" class="${S.szen==='ist'?'on':''}">Ist</button>`+
    `<button data-s="plan" class="${S.szen==='plan'?'on plan':''}">Plan</button></div>`+
    `<div class="spacer"></div><span class="hint">Beträge in Euro</span></div>`;
}

function guvTabelle(f,jahr,szen,w,wp,wv,mon){
  let h=`<table><tr><th>Position</th><th>${esc(jahr)} ${szen==='ist'?'Ist':'Plan'}</th>`+
    `<th>Plan ${esc(jahr)}</th><th>Abw.</th><th>Vorjahr</th><th>Abw. VJ</th></tr>`;
  for(const g of GUV){
    const v=w[g.id]||0, p=wp[g.id]||0, vj=wv[g.id]||0;
    const isSum=!g.kats.length;
    const key='g:'+g.id, offen=S.offen[key];
    h+=`<tr class="${isSum?'sum':'head click'}" ${isSum?'':`data-k="${key}"`}>`+
      `<td>${isSum?'':(offen?'▾ ':'▸ ')}${esc(g.label)}</td>`+
      `<td class="${sign(v)}">${fmt(v)}</td>`+
      `<td class="dim">${p?fmt(p):'—'}</td>`+
      `<td class="${p?sign(v-p):'dim'}">${p?fmt(v-p):'—'}</td>`+
      `<td class="dim">${vj?fmt(vj):'—'}</td>`+
      `<td class="${vj?sign(v-vj):'dim'}">${vj?fmt(v-vj):'—'}</td></tr>`;
    if(!isSum && offen){
      for(const k of g.kats){
        const kv=katSum(f,szen,k,mon)*g.vz;
        const kp=katSum(f,'plan',k,monateVon(jahr,'plan',szen==='ist'&&jahr===IST_JAHR?IST_MON:12))*g.vz;
        const kvj=katSum(f,szen,k,monateVon(String(+jahr-1),szen,szen==='ist'&&jahr===IST_JAHR?IST_MON:12))*g.vz;
        if(!kv && !kp && !kvj) continue;
        const kk='k:'+g.id+':'+k, ko=S.offen[kk];
        const konten=((D.konto[f]||{})[jahr]||{})[k];
        h+=`<tr class="kat ${konten?'click':''}" ${konten?`data-k="${esc(kk)}"`:''}>`+
          `<td>${konten?(ko?'▾ ':'▸ '):''}${esc(k)}</td><td>${fmt(kv)}</td>`+
          `<td class="dim">${kp?fmt(kp):'—'}</td><td class="${kp?sign(kv-kp):'dim'}">${kp?fmt(kv-kp):'—'}</td>`+
          `<td class="dim">${kvj?fmt(kvj):'—'}</td><td class="${kvj?sign(kv-kvj):'dim'}">${kvj?fmt(kv-kvj):'—'}</td></tr>`;
        if(ko && konten){
          const ent=Object.entries(konten).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
          for(const [nr,val] of ent){
            if(!val) continue;
            const nm=D.kontoname[nr]||'';
            h+=`<tr class="konto"><td>${esc(nr)}${nm?` <span class="tw">${esc(nm)}</span>`:''}</td>`+
               `<td>${fmt(val*g.vz)}</td><td colspan="4"></td></tr>`;
          }
        }
      }
    }
  }
  return h+'</table>';
}

function bilanzTabelle(f,szen,st,b){
  const jahr=st.slice(0,4);
  const erg=guvWerte(f,szen,monateVon(jahr,szen,+st.slice(5,7)))._jahr;
  const rest=(b._aktiva-b._passiva)-erg;
  const zeile=(g)=>{
    const v=b[g.id]||0; if(!v) return '';
    const key='b:'+g.id, offen=S.offen[key];
    const anteil=b._aktiva?Math.abs(v)/Math.abs(b._aktiva)*100:0;
    let r=`<tr class="head click" data-k="${key}"><td>${offen?'▾ ':'▸ '}${esc(g.label)}</td>`+
      `<td>${fmt(v)}</td><td class="bar-cell"><div class="bg" style="width:${(anteil*0.85).toFixed(1)}%"></div>`+
      `<span class="dim">${nf1.format(anteil)} %</span></td></tr>`;
    if(offen) for(const k of g.kats){
      const q=(D[szen][f]||{})[k], kv=q&&q[st]?q[st]:0; if(!kv) continue;
      r+=`<tr class="kat"><td>${esc(k)}</td><td>${fmt(kv)}</td><td></td></tr>`;
    }
    return r;
  };
  let h=`<div class="grid2"><div><table><tr><th>Aktiva</th><th>${esc(st)}</th><th>Anteil</th></tr>`+
    BIL.filter(g=>g.seite==='A').map(zeile).join('')+
    `<tr class="sum"><td>Summe Aktiva</td><td>${fmt(b._aktiva)}</td><td></td></tr></table></div>`+
    `<div><table><tr><th>Passiva</th><th>${esc(st)}</th><th>Anteil</th></tr>`+
    BIL.filter(g=>g.seite==='P').map(zeile).join('')+
    `<tr class="head"><td>Jahresergebnis lt. GuV</td><td class="${sign(erg)}">${fmt(erg)}</td><td></td></tr>`+
    (Math.abs(rest)>5?`<tr class="head"><td><span class="neg">Abstimmdifferenz</span></td>`+
      `<td class="neg">${fmt(rest)}</td><td></td></tr>`:'')+
    `<tr class="sum"><td>Summe Passiva</td><td>${fmt(b._passiva+erg+(Math.abs(rest)>5?rest:0))}</td><td></td></tr>`+
    `</table></div></div>`;
  if(Math.abs(rest)>5) h+=`<div class="notice warn" style="margin-top:14px"><div class="ic">⚠</div><div>`+
    `Aktiva und Passiva gehen zum ${esc(st)} um ${fmt(rest)} Euro auseinander, auch nachdem das `+
    `Jahresergebnis eingerechnet wurde. Die Abweichung steckt in den Rohdaten, nicht in dieser Auswertung.`+
    `</div></div>`;
  return h;
}

/* ===================== Firmenvergleich ===================== */
const VGL = [
  {id:'umsatz',  label:'Umsatzerlöse'},
  {id:'_roh',    label:'Rohergebnis'},
  {id:'personal',label:'Personalaufwand'},
  {id:'_ebitda', label:'EBITDA'},
  {id:'_ebit',   label:'Betriebsergebnis'},
  {id:'_jahr',   label:'Jahresergebnis'},
];
function renderVergleich(){
  const jahr=S.jahr, szen=S.szen, mon=monateVon(jahr,szen);
  const rows=D.firmen.map(f=>{
    const w=guvWerte(f.name,szen,mon);
    const st=letzterMonat(f.name,szen,jahr);
    const b=st?bilWerte(f.name,szen,st):null;
    return {name:f.name, land:f.land, w, bil:b};
  }).sort((a,b)=>(b.w.umsatz||0)-(a.w.umsatz||0));
  const ges={}; VGL.forEach(v=>ges[v.id]=rows.reduce((a,r)=>a+(r.w[v.id]||0),0));
  const maxU=Math.max(...rows.map(r=>Math.abs(r.w.umsatz||0)),1);

  let h=`<div class="section-banner"><div class="sb-icon">◫</div><div><h1>Firmenvergleich</h1>`+
    `<div class="sb-sub">${esc(jahr)} · ${szen==='ist'?'Ist':'Plan'}`+
    (szen==='ist'&&jahr===IST_JAHR?` bis ${MON[IST_MON-1]}`:'')+
    ` · Summe der Einzelgesellschaften, nicht konsolidiert</div></div></div>`;
  h+=filterleiste();

  h+=`<div class="panel"><h2>Umsatz je Gesellschaft</h2><div class="body">`+
    chart({labels:rows.map(r=>r.name.length>15?r.name.slice(0,14)+'…':r.name),
      height:260,width:900,
      series:[{name:'Umsatz',color:'#2196f3',vals:rows.map(r=>r.w.umsatz||0)}]})+
    `</div></div>`;

  h+=`<div class="panel"><h2>Kennzahlen ${esc(jahr)}</h2><div class="body"><table>`+
    `<tr><th>Gesellschaft</th>`+VGL.map(v=>`<th>${esc(v.label)}</th>`).join('')+
    `<th>Bilanzsumme</th><th>Liquidität</th></tr>`+
    rows.map(r=>`<tr class="click" data-firma="${esc(r.name)}"><td>${esc(r.name)} `+
      `<span class="tw">${esc(r.land)}</span></td>`+
      VGL.map(v=>`<td class="${sign(r.w[v.id]||0)}">${fmt(r.w[v.id]||0)}</td>`).join('')+
      `<td class="dim">${r.bil?fmt(r.bil._aktiva):'—'}</td>`+
      `<td class="dim">${r.bil?fmt(r.bil.liquide):'—'}</td></tr>`).join('')+
    `<tr class="sum"><td>Summe</td>`+VGL.map(v=>`<td class="${sign(ges[v.id])}">${fmt(ges[v.id])}</td>`).join('')+
    `<td></td><td></td></tr></table>`+
    `<div class="notice info" style="margin-top:14px"><div class="ic">ℹ</div><div>`+
    `Diese Summe ist <strong>nicht</strong> der Konzernabschluss: Innenumsätze und `+
    `Beteiligungserträge sind darin noch enthalten. Die konsolidierte Sicht steht unter „Konsolidierung“.`+
    `</div></div></div></div>`;
  return h;
}

/* ===================== Datenqualität ===================== */
function renderQualitaet(){
  const bc=D.checks.bilanz||[], uc=D.checks.umsatz2025||[];
  const proFirma={}; bc.forEach(x=>{proFirma[x.firma]=(proFirma[x.firma]||0)+1;});
  let h=`<div class="section-banner"><div class="sb-icon">⚑</div><div><h1>Datenqualität</h1>`+
    `<div class="sb-sub">Was beim Aufbau dieser Auswertung nicht aufgegangen ist</div></div></div>`;

  h+=`<div class="panel"><h2>Bekannte Lücken</h2><div class="body">`+
    D.checks.luecken.map(t=>`<div class="notice warn"><div class="ic">⚠</div><div>${esc(t)}</div></div>`).join('')+
    `</div></div>`;

  h+=`<div class="panel"><h2>Bilanzprobe<span class="note">Aktiva minus Passiva muss dem `+
    `kumulierten Jahresergebnis entsprechen</span></h2><div class="body">`;
  if(!bc.length) h+=`<div class="hint">Alle Firmen, alle Monate: die Bilanz schließt.</div>`;
  else{
    h+=`<div class="notice info"><div class="ic">ℹ</div><div>In ${bc.length} von allen geprüften `+
      `Firmenmonaten geht die Bilanz nicht auf. Betroffen sind:</div></div><table>`+
      `<tr><th>Gesellschaft</th><th>Monate</th><th>größte Abweichung</th></tr>`+
      Object.entries(proFirma).sort((a,b)=>b[1]-a[1]).map(([f,n])=>{
        const mx=bc.filter(x=>x.firma===f).sort((a,b)=>Math.abs(b.rest)-Math.abs(a.rest))[0];
        return `<tr><td>${esc(f)}</td><td>${n}</td><td class="neg">${fmt(mx.rest)} `+
          `<span class="tw">${esc(mx.monat)}</span></td></tr>`;
      }).join('')+`</table>`;
  }
  h+=`</div></div>`;

  h+=`<div class="panel"><h2>Umsatzabgleich 2025<span class="note">LucaNet gegen Rohdaten `+
    `der Einzelgesellschaften</span></h2><div class="body"><table>`+
    `<tr><th>Gesellschaft</th><th>LucaNet</th><th>Rohdaten (extern + Gruppe)</th><th>Differenz</th></tr>`+
    uc.map(r=>`<tr><td>${esc(r.firma)}${r.inRoh?'':' <span class="tw">nicht in den Rohdaten</span>'}</td>`+
      `<td>${fmt(r.konso)}</td><td>${r.inRoh?fmt(r.roh):'<span class="dim">—</span>'}</td>`+
      `<td class="${Math.abs(r.diff)>Math.max(1000,Math.abs(r.konso)*0.01)?'neg':'dim'}">`+
      `${r.inRoh?fmt(r.diff):'—'}</td></tr>`).join('')+
    `</table><div class="notice info" style="margin-top:14px"><div class="ic">ℹ</div><div>`+
    esc(D.checks.umsatz_hinweis||'')+`</div></div></div></div>`;

  const pc = D.checks.plan2026||[];
  if(pc.length){
    const abw = pc.filter(r=>Math.abs(r.diff)>500).length;
    h+=`<div class="panel"><h2>Planabgleich 2026<span class="note">LucaNet-Plankonsolidierung `+
      `gegen Planrohdaten</span></h2><div class="body"><table>`+
      `<tr><th>Gesellschaft</th><th>LucaNet Plan</th><th>Planrohdaten</th><th>Differenz</th></tr>`+
      pc.map(r=>`<tr><td>${esc(r.firma)}</td><td>${fmt(r.konso)}</td>`+
        `<td>${r.inRoh?fmt(r.roh):'<span class="dim">—</span>'}</td>`+
        `<td class="${Math.abs(r.diff)>500?'neg':'dim'}">${r.inRoh?fmt(r.diff):'—'}</td></tr>`).join('')+
      `<tr class="sum"><td>Summe</td><td>${fmt(pc.reduce((a,r)=>a+r.konso,0))}</td>`+
      `<td>${fmt(pc.reduce((a,r)=>a+r.roh,0))}</td>`+
      `<td>${fmt(pc.reduce((a,r)=>a+r.diff,0))}</td></tr></table>`+
      `<div class="notice info" style="margin-top:14px"><div class="ic">ℹ</div><div>`+
      (abw?`${abw} Gesellschaften weichen ab. `:`Alle Gesellschaften stimmen auf den Euro. `)+
      esc(D.checks.plan_hinweis||'')+`</div></div></div></div>`;
  }
  return h;
}

/* ===================== Steuerung ===================== */
function render(){
  document.getElementById('stamp').innerHTML =
    `Gebaut ${esc(D.gebaut)}<br>Ist bis ${esc(D.ist_bis)}`;
  document.getElementById('nav').innerHTML = navHTML();
  const c = document.getElementById('content');
  c.innerHTML = S.view==='konzern' ? renderKonzern()
              : S.view==='vergleich' ? renderVergleich()
              : S.view==='qualitaet' ? renderQualitaet()
              : renderFirma();
  bindNav();
  c.querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>{
    const k=el.dataset.k; S.offen[k]=!S.offen[k]; render();
  });
  c.querySelectorAll('#segJ button').forEach(b=>b.onclick=()=>{S.jahr=b.dataset.j;render();});
  c.querySelectorAll('#segS button').forEach(b=>b.onclick=()=>{S.szen=b.dataset.s;render();});
  c.querySelectorAll('#segM button').forEach(b=>b.onclick=()=>{S.stapelMass=b.dataset.m;render();});
  c.querySelectorAll('#segZ button').forEach(b=>b.onclick=()=>{S.stapelZeit=b.dataset.z;render();});
  c.querySelectorAll('[data-firma]').forEach(el=>el.onclick=()=>{
    S.view='firma'; S.firma=el.dataset.firma; S.offen={}; render();
    window.scrollTo(0,0);
  });
  window.scrollTo(0,0);
}
function boot(daten){
  D = daten;
  GUV = D.guv; BIL = D.bilanz; SUB = D.subtotal;
  GID = {}; GUV.forEach(g=>GID[g.id]=g);
  JAHRE_IST  = [...new Set(D.monate.filter(m=>m<=D.ist_bis).map(m=>m.slice(0,4)))].sort();
  JAHRE_PLAN = [...new Set(Object.values(D.plan).flatMap(o=>Object.values(o)
                 .flatMap(mm=>Object.keys(mm))).map(m=>m.slice(0,4)))].sort();
  IST_JAHR = D.ist_bis.slice(0,4); IST_MON = +D.ist_bis.slice(5,7);
  S.firma = D.firmen[0].name; S.jahr = IST_JAHR;
  S.stapelZeit = S.stapelZeit || IST_JAHR;
  document.getElementById('gate').style.display = 'none';
  document.querySelector('.app').style.display = '';
  render();
}

const b64u=s=>{const b=atob(s),u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
async function entsperren(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),
    'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b64u(CT.s),iterations:CT.it,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  const klar=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u(CT.i)},key,b64u(CT.c));
  const strom=new Blob([new Uint8Array(klar)]).stream()
    .pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(new TextDecoder().decode(await new Response(strom).arrayBuffer()));
}
const f=document.getElementById('gateForm'), msg=document.getElementById('gateMsg'),
      btn=document.getElementById('gateBtn'), pw=document.getElementById('pw');
if(!window.crypto||!crypto.subtle){
  msg.textContent='Dieser Browser kann die Daten nicht entschlüsseln.';
  btn.disabled=true;
}
pw.addEventListener('keydown',e=>{
  if(e.key==='Enter'){ e.preventDefault(); f.requestSubmit(); }
});
f.addEventListener('submit',async e=>{
  e.preventDefault();
  btn.disabled=true; pw.disabled=true;
  msg.className='gate-msg busy'; msg.textContent='Entschlüsseln …';
  await new Promise(r=>setTimeout(r,30));
  try{
    const daten=await entsperren(pw.value);
    msg.textContent=''; pw.value='';
    boot(daten);
  }catch(err){
    msg.className='gate-msg'; msg.textContent='Passwort falsch.';
    btn.disabled=false; pw.disabled=false; pw.value=''; pw.focus();
  }
});
